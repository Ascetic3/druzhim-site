<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-label="04 / Замещающие семьи"><title>04 / Замещающие семьи</title><defs><style>@font-face{font-family:"Literata";src:url(../fonts/Literata.ttf) format("truetype");font-weight:100 900;font-style:normal;}@font-face{font-family:"Golos Text";src:url(../fonts/GolosText.ttf) format("truetype");font-weight:100 900;font-style:normal;}</style></defs><rect x="0" y="0" width="1440" height="840" rx="0" fill="#E3E9DE"/><text data-width="1000" data-x="80" data-y="64" data-label="Замещающие семьи" font-family="Golos Text" font-size="18" font-weight="500" fill="#203C32" text-anchor="start"><tspan x="80" y="82">Замещающие семьи</tspan></text><text data-width="1280" data-x="80" data-y="106" data-label="Семье тоже нужна поддержка" font-family="Literata" font-size="64" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="80" y="170">Семье тоже нужна поддержка</tspan></text><image x="80" y="250" width="704" height="420" href="../references/still-life.png" preserveAspectRatio="xMidYMid slice"/><text data-width="512" data-x="848" data-y="246" data-label="Особое внимание — семьям, связанным с опекой, прие" font-family="Golos Text" font-size="24" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="848" y="270">Особое внимание — семьям, связанным с</tspan><tspan x="848" y="306">опекой, приемным родительством и</tspan><tspan x="848" y="342">усыновлением.</tspan></text><text data-width="512" data-x="848" data-y="432" data-label="Поддержка важна и детям в учреждениях, и выпускник" font-family="Golos Text" font-size="20" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="848" y="452">Поддержка важна и детям в учреждениях, и</tspan><tspan x="848" y="482">выпускникам, которые начинают самостоятельную</tspan><tspan x="848" y="512">жизнь.</tspan></text><text data-width="500" data-x="848" data-y="608" data-label="Обсудить свою ситуацию" font-family="Golos Text" fon