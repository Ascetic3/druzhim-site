<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="676" viewBox="0 0 1440 676" role="img" aria-label="07 / Миссия"><title>07 / Миссия</title><defs><style>@font-face{font-family:"Literata";src:url(../fonts/Literata.ttf) format("truetype");font-weight:100 900;font-style:normal;}@font-face{font-family:"Golos Text";src:url(../fonts/GolosText.ttf) format("truetype");font-weight:100 900;font-style:normal;}</style></defs><rect x="0" y="0" width="1440" height="676" rx="0" fill="#F7F5EF"/><text data-width="1000" data-x="80" data-y="64" data-label="Наша миссия" font-family="Golos Text" font-size="18" font-weight="500" fill="#203C32" text-anchor="start"><tspan x="80" y="82">Наша миссия</tspan></text><text data-width="1280" data-x="80" data-y="112" data-label="Больше самостоятельности.
Больше возможностей
быть" font-family="Literata" font-size="64" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="80" y="176">Больше самостоятельности.</tspan><tspan x="80" y="256">Больше возможностей</tspan><tspan x="80" y="336">быть собой.</tspan></text><text data-width="616" data-x="744" data-y="430" data-label="Создаем безопасное и поддерживающее пространство, " font-family="Golos Text" font-size="20" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="744" y="450">Создаем безопасное и поддерживающее пространство, где</tspan><tspan x="744" y="480">дети, молодежь и семьи могут раскрывать потенциал и</tspan><tspan x="744" y="510">уверенно строить будущее без барьеров и стереотипов.</tspan></text><path d="M0 434 C220 430 248 532 588 532 M0 630 C240 630 250 532 588 532" fill="none" stroke="#9D442F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="588" cy="532" r="4" fill="#9D442F" stroke="#9D442F" stroke-width="2"/></svg>