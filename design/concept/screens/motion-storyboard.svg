Аудитории:" font-family="Golos Text" font-size="18" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="80" y="888">Hero: одна короткая последовательность.</tspan><tspan x="80" y="918">Аудитории: статическая общая линия.</tspan><tspan x="80" y="948">Замещающие семьи: однократное раскрытие фото, 400 ms.</tspan><tspan x="80" y="978">Второй сезон: схождение путей, 500 ms при входе.</tspan><tspan x="80" y="1008">FAQ и меню: локальная смена состояния, 160–200 ms.</tspan></text><text data-width="576" data-x="784" data-y="798" data-label="Reduced motion / mobile" font-family="Literata" font-size="36" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="784" y="834">Reduced motion / mobile</tspan></text><text data-width="576" data-x="784" data-y="870" data-label="reduce: все пути и узлы сразу в конечном виде;
нет" font-family="Golos Text" font-size="18" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="784" y="888">reduce: все пути и узлы сразу в конечном виде;</tspan><tspan x="784" y="918">нет масок, перемещений и scroll-linked эффектов.</tspan><tspan x="784" y="948">На mobile: одна статическая линия, без скраббинга.</tspan><tspan x="784" y="978">Фото без маски, текст сразу виден.</tspan><tspan x="784" y="1008">Без pinning, параллакса и перехвата прокрутки.</tspan></text><path d="M80 1100 L1360 1100" fill="none" stroke="#B7C1B4" stroke-width="1"/><text data-width="1280" data-x="80" data-y="1144" data-label="Техническая аннотация для будущей реализации: CSS " font-family="Golos Text" font-size="18" font-weight="400" fill="#59655D" text-anchor="start"><tspan x="80" y="1162">Техническая аннотация для будущей реализации: CSS для hover/focus; GSAP только для координации SVG.</tspan><tspan x="80" y="1192">Если JavaScript не загрузился, контент и финальная геометрия остаются видимыми. GSAP-код не создан.</tspan></text></svg>