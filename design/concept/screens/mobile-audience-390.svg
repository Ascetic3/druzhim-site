<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1004" viewBox="0 0 390 1004" role="img" aria-label="Mobile / Кому помогаем 390"><title>Mobile / Кому помогаем 390</title><defs><style>@font-face{font-family:"Literata";src:url(../fonts/Literata.ttf) format("truetype");font-weight:100 900;font-style:normal;}@font-face{font-family:"Golos Text";src:url(../fonts/GolosText.ttf) format("truetype");font-weight:100 900;font-style:normal;}</style></defs><rect x="0" y="0" width="390" height="1004" rx="0" fill="#F7F5EF"/><text data-width="342" data-x="24" data-y="48" data-label="Кому мы
