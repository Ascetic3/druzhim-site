м" font-family="Literata" font-size="28" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="56" y="650">Семьям</tspan></text><text data-width="310" data-x="56" data-y="674" data-label="Объединяем опыт родителей и специалистов." font-family="Golos Text" font-size="18" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="56" y="692">Объединяем опыт родителей и</tspan><tspan x="56" y="720">специалистов.</tspan></text><circle cx="32" cy="794" r="5" fill="#F7F5EF" stroke="#9D442F" stroke-width="2"/><text data-width="310" data-x="56" data-y="770" data-label="Людям с особенностями развития" font-family="Literata" font-size="28" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="56" y="798">Людям с</tspan><tspan x="56" y="834">особенностями</tspan><tspan x="56" y="870">развития</tspan></text><text data-width="310" data-x="56" data-y="894" data-label="Помогаем включаться в жизнь сообщества." font-family="Golos Text" font-size="18" font-weight="400" fill="#203C32" text-anchor="start"><tspan x="56" y="912">Помогаем включаться в жизнь</tspan><tspan x="56" y="940">сообщества.</tspan></text></svg>